
{% extends 'base.html' %}

{% block title %}Edit Transaction | Expense Tracker{% endblock %}

{% block content %}

<div class="transaction-page">

    <div class="transaction-card">

        <div class="transaction-form-heading">
            <h2>Edit Transaction</h2>
            <p>Update your transaction details.</p>
        </div>

        <form method="POST">

            <label>Transaction Type</label>
            <select name="transaction_type" required>
                <option value="income"
                {% if transaction.transaction_type|lower == 'income' %}selected{% endif %}>
                    Income
                </option>

                <option value="expense"
                {% if transaction.transaction_type|lower == 'expense' %}selected{% endif %}>
                    Expense
                </option>
            </select>

            <label>Category</label>
            <input type="text" name="category"
                   value="{{ transaction.category }}" required>

            <label>Amount</label>
            <input type="number" name="amount" step="0.01"
                   value="{{ transaction.amount }}" min="0.01" required>

            <label>Description</label>
            <textarea name="description">{{ transaction.description or '' }}</textarea>

            <label>Date</label>
            <input type="date" name="date"
                   value="{{ transaction.date.strftime('%Y-%m-%d') }}" required>

            <button type="submit" class="add-transaction-btn">
                Update Transaction
            </button>

            <a href="{{ url_for('my_transactions') }}">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
